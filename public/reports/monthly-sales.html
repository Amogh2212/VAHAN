<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fuel-agnostic VAHAN monthly sales reports with fuel mix, category sales, trends, and OEM leaderboards." />
    <title>Monthly Sales Report - VAHAN</title>
    <link rel="stylesheet" href="/styles.css?v=monthly-form-wrap-20260612" />

  <link rel="stylesheet" href="/atlas.css" />
  </head>
  <body class="atlas-page monthly-report-page" data-atlas-route="monthly-report">
    <a class="skip-link" href="#mainContent">Skip to monthly report workspace</a>
    <div class="app-frame">
      <header class="system-header" id="systemHeader"><a href="/">Vahan Analyst</a></header>

      <main class="shell report-shell" id="mainContent" tabindex="-1">
        <section class="report-control-panel">
          <div class="hero-title-row">

            <div>
              <p class="eyebrow">Fuel-agnostic reporting</p>
              <h1>Monthly Vehicle Sales Report</h1>
            </div>
          </div>

          <section class="report-auth-strip" aria-label="Monthly report account">
            <div class="report-account-copy">
              <span class="panel-kicker">Account</span>
              <strong id="accountStatus">Signed out</strong>
            </div>
            <div class="report-account-actions">
              <a class="secondary-action report-login" id="authGate" href="/auth/google?returnTo=/reports/monthly-sales.html">Sign in with Google</a>
              <button type="button" class="secondary-action danger-action" id="logoutBtn" hidden>Logout</button>
            </div>
          </section>

          <div id="monthlyReportWorkspace" hidden>
            <form id="monthlyReportForm" class="monthly-report-form" autocomplete="off">
              <label>
                <span>Month</span>
                <input id="reportMonth" name="month" type="month" />
              </label>
              <label>
                <span>Location</span>
                <input id="reportLocation" name="location" placeholder="All India, Maharashtra, Pune RTO" />
              </label>
              <label>
                <span>Fuel scope</span>
                <select id="fuelScope" name="fuelScope">
                  <option value="all">All fuels</option>
                  <option value="segment">Fuel segment/family</option>
                  <option value="exact">Exact VAHAN fuel label</option>
                </select>
              </label>
              <label>
                <span>Fuel</span>
                <input id="reportFuel" name="fuel" placeholder="EV, PETROL, DIESEL, CNG, HYBRID, PURE EV" />
              </label>
              <button type="submit" id="loadReportBtn">Generate report</button>
              <a class="secondary-action report-pdf-action" id="downloadReportPdf" href="#" aria-disabled="true">Download PDF</a>
            </form>
          </div>
        </section>

        <section id="monthlyReport" class="monthly-report-output">
          <p class="result-empty">Choose a month and fuel scope to generate an EVReporter-style report for any fuel category.</p>
        </section>
      </main>
    </div>
    <script src="/system.js"></script>
    <script src="/reports/monthly-sales.js?v=20260725-atlas-prerequisite"></script>
  </body>
</html>
