<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f9"/>
    </linearGradient>
    <linearGradient id="c3Violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46b8"/>
      <stop offset="100%" stop-color="#695eed"/>
    </linearGradient>
    <filter id="drop3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#182139" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#e3e6ed" stroke-width="2"/>

  <g filter="url(#drop3)">
    <!-- Solid Left Monolith -->
    <path d="M 130 130 
             L 190 130 
             L 256 345 
             L 220 375 
             L 185 375 Z" 
          fill="#182139"/>

    <!-- Right Side Stepped Data Bars forming the V angle -->
    <!-- Bar 1 (Lowest) -->
    <rect x="264" y="320" width="30" height="55" rx="8" fill="#4f46b8"/>
    <!-- Bar 2 (Mid-low) -->
    <rect x="304" y="260" width="30" height="115" rx="8" fill="#5b52c7"/>
    <!-- Bar 3 (Mid-high) -->
    <rect x="344" y="195" width="30" height="180" rx="8" fill="#6f65ec"/>
    <!-- Bar 4 (Peak) -->
    <rect x="384" y="130" width="30" height="245" rx="8" fill="#887ef7"/>

    <!-- Circular Intelligence Beacon atop Peak Bar -->
    <circle cx="399" cy="95" r="18" fill="#f6bea5" stroke="#ffffff" stroke-width="4"/>
    <circle cx="399" cy="95" r="8" fill="#ea6535"/>

    <!-- Connective analytical horizon trendline -->
    <polyline points="190,130 256,345 399,95" 
              fill="none" 
              stroke="#f6bea5" 
              stroke-width="4" 
              stroke-dasharray="6 6" 
              opacity="0.75"/>
  </g>
</svg>