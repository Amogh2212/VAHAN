<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Query and explore VAHAN vehicle registration data across Indian states and RTOs. Powered by live scraping of the VAHAN public dashboard." />
    <title>VAHAN Registration Dashboard - Vehicle Registration Intelligence</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230f172a'/><text x='50' y='64' text-anchor='middle' font-size='52' font-family='Arial' fill='%23f8fafc'>V</text></svg>" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-frame">
      <aside class="feature-sidebar" id="featureSidebar" aria-label="Dashboard features">
        <div class="sidebar-brand">
          <span class="sidebar-mark brand-mark">V</span>
          <div>
            <strong>VAHAN</strong>
            <small>Features</small>
          </div>
        </div>
        <nav class="feature-nav" aria-label="Feature navigation">
          <a class="feature-link active" href="/" aria-current="page">
            <span class="feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v4H4zM14 15h6v4h-6z" />
              </svg>
            </span>
            <span>Dashboard</span>
          </a>
          <a class="feature-link" href="/compare.html">
            <span class="feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3" />
              </svg>
            </span>
            <span>Compare data</span>
          </a>
          <a class="feature-link" href="/map.html">
            <span class="feature-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M9 18 3 21V6l6-3 6 3 6-3v15l-6 3-6-3Z" />
                <path d="M9 3v15M15 6v15" />
              </svg>
            </span>
            <span>Map view</span>
          </a>
        </nav>
      </aside>
    <main class="shell" id="app">
      <!-- Hero / Query Panel -->
      <section class="query-panel" id="queryPanel">
        <div class="dashboard-toolbar">
          <div class="hero-title-row">
            <div class="sidebar-shell" id="sidebarShell">
              <button type="button" class="sidebar-trigger" id="sidebarTrigger" aria-label="Open feature menu">
                <span class="sidebar-mark trigger-mark">V</span>
              </button>
            </div>
            <div class="query-panel-head">
              <p class="eyebrow">VAHAN Aggregate Dashboard</p>
              <h1>Registration Query Dashboard</h1>
            </div>
          </div>
          <div class="download-menu">
            <button type="button" class="download-trigger" id="downloadMenuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Download report">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="M12 3v10m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" />
              </svg>
            </button>
            <div class="download-options" role="menu" aria-label="Download options">
              <button type="button" class="secondary-action" id="downloadCsvBtn" role="menuitem" disabled>Download CSV</button>
              <button type="button" class="secondary-action" id="downloadPdfBtn" role="menuitem" disabled>Download PDF</button>
            </div>
          </div>
        </div>
        <form id="queryForm" class="query-form" autocomplete="off">
          <input
            id="queryInput"
            name="query"
            placeholder="e.g. EV registrations in Noida from May 2024 to May 2025"
            value="fork lift registrations in Maharashtra in 2024"
          />
          <button type="submit" id="submitBtn">
            <span class="btn-text">Run Query</span>
          </button>
        </form>
        <p id="freshness" class="freshness"></p>
      </section>

      <!-- Warnings -->
      <section id="warnings" class="warnings" hidden></section>

      <!-- Summary Cards -->
      <section class="cards" id="summaryCards">
        <article id="card-total">
          <span>Total Registrations</span>
          <strong id="total">0</strong>
        </article>
        <article id="card-average">
          <span>Monthly Average</span>
          <strong id="average">0</strong>
        </article>
        <article id="card-peak">
          <span>Peak Month</span>
          <strong id="peak">-</strong>
        </article>
        <article id="card-rows">
          <span>Rows Returned</span>
          <strong id="rowCount">0</strong>
        </article>
      </section>

      <!-- Filters + Trend -->
      <section class="grid">
        <article class="panel" id="filtersPanel">
          <div class="panel-head">
            <h2>Parsed Filters</h2>
          </div>
          <dl id="filters" class="filters"></dl>
        </article>

        <article class="panel" id="trendPanel">
          <div class="panel-head">
            <h2>Monthly Trend</h2>
          </div>
          <div id="trend" class="bars"></div>
        </article>
      </section>

      <!-- Fuel Breakdown -->
      <section class="panel" id="fuelPanel">
        <div class="panel-head">
          <h2>Fuel Breakdown</h2>
        </div>
        <div id="fuelBreakdown" class="fuel-list"></div>
      </section>

      <!-- Result Table -->
      <section class="panel" id="tablePanel">
        <div class="panel-head">
          <h2>Result Rows</h2>
        </div>
        <div id="rowChart" class="row-chart">
          <p class="result-empty">Run a query to review results grouped by month.</p>
        </div>
      </section>
    </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
