name: Reviewed Audit Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-audit-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check --no-cache-dir "semgrep==1.172.0"

      - name: Select attribution baseline
        id: baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          candidate="${PR_BASE:-$PUSH_BEFORE}"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]] || [[ "$candidate" =~ ^0+$ ]]; then
            candidate="$(git rev-parse HEAD^)"
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Validate Semgrep rules and sanitizer
        run: |
          semgrep --validate --config audit/semgrep.yml
          python scripts/audit-semgrep-fixtures.test.py
          python scripts/audit-sanitize-semgrep.test.py

      - name: Run reviewed audit gate
        env:
          AUDIT_BASELINE: ${{ steps.baseline.outputs.sha }}
        run: npm run audit:ci -- --baseline "$AUDIT_BASELINE"

      - name: Upload sanitized gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-audit-gate-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
