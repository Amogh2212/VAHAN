name: Stage OEM tracking database copy
on:
  push:
    branches: [codex/oem-storage-split]
    paths: [docs/oem-copy-approved.flag]

permissions:
  contents: read

concurrency:
  group: vahan-rto-oem-tracking-production
  cancel-in-progress: false

jobs:
  copy:
    if: github.repository == 'Amogh2212/VAHAN' && github.ref == 'refs/heads/codex/oem-storage-split'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev --ignore-scripts
      - name: Verify and copy the selected OEM tables
        env:
          OEM_COPY_SOURCE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
          OEM_COPY_TARGET_URL: ${{ secrets.OEM_DATABASE_URL }}
        run: |
          node --input-type=module <<'JS'
          import { copyOemTracking } from './scripts/copy-rto-oem-tracking.mjs';
          try {
            function checkedUrl(raw, endpoint, allowPooler = false) {
              const url = new URL(raw);
              const [label, ...domain] = url.hostname.split('.');
              if (!['postgres:', 'postgresql:'].includes(url.protocol)
                || !url.username || !url.password || (url.port && url.port !== '5432')
                || url.pathname !== '/neondb'
                || !url.hostname.endsWith('.neon.tech')
                || (label !== endpoint && !(allowPooler && label === endpoint + '-pooler'))) {
                throw new TypeError('Database connection did not pass checks.');
              }
              url.hostname = [endpoint, ...domain].join('.');
              return url;
            }
            // Match the independently confirmed Neon production endpoint IDs.
            const source = checkedUrl(process.env.OEM_COPY_SOURCE_URL, 'ep-morning-pond-az4f1c1z', true);
            const target = checkedUrl(process.env.OEM_COPY_TARGET_URL, 'ep-royal-mountain-bizy3qvq');
            await copyOemTracking({
              sourceUrl: source.href,
              targetUrl: target.href,
              expectedSourceHost: source.hostname,
              expectedTargetHost: target.hostname,
              log: console.log,
            });
          } catch (error) {
            console.error(error instanceof TypeError ? 'Check the source and destination connection settings.' : error.message);
            process.exitCode = 1;
          }
          JS
