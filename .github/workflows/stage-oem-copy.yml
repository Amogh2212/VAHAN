name: Verify staged OEM tracking databases
on:
  push:
    branches: [codex/oem-storage-split]
    paths: [docs/oem-copy-approved.flag]

permissions:
  contents: read

concurrency:
  group: vahan-rto-oem-tracking-production
  cancel-in-progress: false

jobs:
  copy:
    if: github.repository == 'Amogh2212/VAHAN' && github.ref == 'refs/heads/codex/oem-storage-split'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev --ignore-scripts
      - name: Verify both copies without writes
        env:
          OEM_COPY_SOURCE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
          OEM_COPY_TARGET_URL: ${{ secrets.OEM_DATABASE_URL }}
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          try {
            function checkedUrl(raw, endpoint, allowPooler = false) {
              const url = new URL(raw);
              const [label, ...domain] = url.hostname.split('.');
              if (!['postgres:', 'postgresql:'].includes(url.protocol)
                || !url.username || !url.password || (url.port && url.port !== '5432')
                || url.pathname !== '/neondb'
                || !url.hostname.endsWith('.neon.tech')
                || (label !== endpoint && !(allowPooler && label === endpoint + '-pooler'))) {
                throw new TypeError('Database connection did not pass checks.');
              }
              url.hostname = [endpoint, ...domain].join('.');
              return url;
            }
            // Match the independently confirmed Neon production endpoint IDs.
            const source = checkedUrl(process.env.OEM_COPY_SOURCE_URL, 'ep-morning-pond-az4f1c1z', true);
            const target = checkedUrl(process.env.OEM_COPY_TARGET_URL, 'ep-royal-mountain-bizy3qvq');
            // Preflight only: compare a sorted multiset of row hashes on both databases.
            // The SQL digest stays inside the verifier and no row data is printed.
            const tables = [
              'baselines', 'scopes', 'makers', 'daily_runs', 'observations',
              'observation_history', 'refresh_attempts'
            ];
            for (const url of [source, target]) {
              if (!['require', 'verify-ca', 'verify-full'].includes(url.searchParams.get('sslmode'))) {
                throw new TypeError('TLS is required.');
              }
            }
            const clients = [source, target].map(url => new pg.Client({
              connectionString: url.href, connectionTimeoutMillis: 15000
            }));
            try {
              await Promise.all(clients.map(async c => {
                await c.connect();
                await c.query("begin isolation level repeatable read read only");
                await c.query("set local time zone 'UTC'; set local statement_timeout = '120s'; set local work_mem = '16MB'");
              }));
              const [src, dst] = clients;
              const size = (await dst.query("select pg_database_size(current_database())::text as bytes")).rows[0].bytes;
              const active = await dst.query("select count(*)::int as n from public.rto_oem_tracking_baselines where is_active");
              if (active.rows[0].n !== 1) throw new Error('Target does not have exactly one active baseline.');
              for (const suffix of tables) {
                const sql = `select count(*)::text as count,
                    encode(sha256(convert_to(coalesce(string_agg(h, '' order by h collate "C"), ''), 'UTF8')), 'hex') as digest
                  from (select encode(sha256(convert_to(to_jsonb(t)::text, 'UTF8')), 'hex') as h
                        from public.rto_oem_tracking_${suffix} as t) as row_hashes`;
                const [a, b] = await Promise.all([src.query(sql), dst.query(sql)]).then(rs => rs.map(r => r.rows[0]));
                if (a.count !== b.count || a.digest !== b.digest) {
                  throw new Error('Source and destination no longer match: ' + suffix);
                }
                console.log('Verified current OEM table ' + suffix + ': ' + b.count + ' rows');
              }
              console.log('Destination database size: ' + size + ' bytes');
            } finally {
              await Promise.allSettled(clients.map(c => c.end()));
            }
          } catch (error) {
            console.error(error instanceof TypeError ? 'Check the source and destination connection settings or TLS.' :
              /^(Source and destination no longer match: |Target does not have exactly one active baseline)/.test(error.message)
                ? error.message : 'Read-only OEM verification failed' + (/^[A-Z0-9]{5}$/.test(error.code ?? '') ? ' (' + error.code + ')' : '') + '.');
            process.exitCode = 1;
          }
          JS
