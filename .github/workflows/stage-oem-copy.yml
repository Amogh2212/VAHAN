name: Stage OEM tracking database copy
on:
  push:
    branches: [codex/oem-storage-split]
    paths: [docs/oem-copy-approved.flag]

permissions:
  contents: read

concurrency:
  group: vahan-rto-oem-tracking-production
  cancel-in-progress: false

jobs:
  copy:
    if: github.repository == 'Amogh2212/VAHAN' && github.ref == 'refs/heads/codex/oem-storage-split'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev --ignore-scripts
      - name: Verify and copy the selected OEM tables
        env:
          OEM_COPY_SOURCE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
          OEM_COPY_TARGET_URL: ${{ secrets.OEM_DATABASE_URL }}
          OEM_COPY_SOURCE_HOST: ${{ vars.OEM_COPY_SOURCE_HOST }}
          OEM_COPY_TARGET_HOST: ${{ vars.OEM_COPY_TARGET_HOST }}
        run: |
          node --input-type=module <<'JS'
          import { copyOemTracking } from './scripts/copy-rto-oem-tracking.mjs';
          try {
            const source = new URL(process.env.OEM_COPY_SOURCE_URL);
            if (source.hostname.endsWith('.neon.tech')) {
              source.hostname = source.hostname.replace("-pooler.", ".");
            }
            await copyOemTracking({
              sourceUrl: source.href,
              targetUrl: process.env.OEM_COPY_TARGET_URL,
              expectedSourceHost: process.env.OEM_COPY_SOURCE_HOST,
              expectedTargetHost: process.env.OEM_COPY_TARGET_HOST,
              log: console.log,
            });
          } catch (error) {
            console.error(error instanceof TypeError ? 'Check the source and destination connection settings.' : error.message);
            process.exitCode = 1;
          }
          JS
