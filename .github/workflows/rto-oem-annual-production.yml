name: RTO Annual OEM Production Collection

on:
  # Legacy annual rankings remain available only when explicitly requested.
  # Automatic daily tracking is owned by rto-oem-tracking-production.yml.
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Optional same-day annual run ID; retry unavailable scopes and keep verified evidence.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vahan-rto-oem-annual-production
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      run_collection: ${{ steps.check.outputs.run_collection }}
    steps:
      - name: Skip collection on October 2, 2026
        id: check
        run: |
          if [ "$(date -u +%F)" = "2026-10-02" ]; then
            echo "run_collection=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_collection=true" >> "$GITHUB_OUTPUT"
          fi
  collect:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.run_collection == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PGSSL: "true"
      RTO_DAILY_DELAY_MS: "1200"
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply annual OEM tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/apply-rto-oem-annual-schema.mjs --production
      - name: Collect six annual OEM segments for the frozen cohort
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OEM_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          if [ -n "$OEM_RESUME_RUN_ID" ]; then
            node scripts/collect-rto-oem-annual.mjs --production --resume-run-id "$OEM_RESUME_RUN_ID"
          else
            node scripts/collect-rto-oem-annual.mjs --production --latest-cohort
          fi
