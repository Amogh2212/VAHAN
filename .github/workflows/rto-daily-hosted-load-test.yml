name: RTO Daily Hosted Load Test

on:
  workflow_dispatch:

concurrency:
  group: vahan-rto-daily-hosted-load-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vahan_rto_action_test?sslmode=disable
      PGSSL: "false"
      RTO_DAILY_WORKERS: "2"
      RTO_DAILY_RETENTION_DAYS: "30"
      RTO_DAILY_DELAY_MS: "1200"
      RTO_DAILY_JITTER_MS: "400"
      RTO_DAILY_MAX_JOB_ATTEMPTS: "3"
      RTO_DAILY_WORK_BUDGET_MINUTES: "315"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vahan_rto_action_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d vahan_rto_action_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create isolated runtime environment
        run: |
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'PGSSL=false\n'
            printf 'RTO_DAILY_WORKERS=2\n'
            printf 'RTO_DAILY_RETENTION_DAYS=30\n'
            printf 'RTO_DAILY_DELAY_MS=1200\n'
            printf 'RTO_DAILY_JITTER_MS=400\n'
            printf 'RTO_DAILY_MAX_JOB_ATTEMPTS=3\n'
            printf 'RTO_DAILY_WORK_BUDGET_MINUTES=315\n'
          } > .env

      - name: Apply ephemeral database schema
        run: node --env-file=.env scripts/apply-db-schema.mjs

      - name: Seed fixed 100-RTO cohort
        run: npm run rto-daily:load-test:seed

      - name: Run one complete 100-RTO collection
        id: collect
        continue-on-error: true
        run: >-
          node --env-file=.env scripts/run-rto-daily-snapshots.mjs
          --work-queue --retry-failed --time-budget-minutes 315 --workers 2 --require-complete

      - name: Create sanitized load-test summary
        if: always()
        continue-on-error: true
        run: node --env-file=.env scripts/rto-daily-load-test-summary.mjs --output artifacts/rto-daily-hosted-load-test-summary.json

      - name: Upload load-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rto-daily-hosted-load-test-${{ github.run_id }}
          path: artifacts/rto-daily-hosted-load-test-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce complete collection
        if: always()
        run: test "${{ steps.collect.outcome }}" = "success"
